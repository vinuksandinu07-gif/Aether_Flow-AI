# Liquidity Sweep + FVG - default configuration (Phase 1).
# Every value below is explicit on purpose: nothing is hardcoded in strategy code.
# Instrument values marked VERIFY are my best knowledge of OANDA defaults; check them
# against GET /v3/accounts/{id}/instruments for YOUR account before trusting sizing.

run:
  name: phase1
  mode: backtest            # backtest | paper | live
  allow_live: false         # live trading requires this explicit flag
  seed: 42
  reports_dir: reports
  tz_sessions: America/New_York

timeframes:
  htf: 4h                   # bias + target liquidity
  mtf: 15m                  # sweep, displacement, MSS, FVG
  ltf: 5m                   # entry trigger / order resolution
  base: 5m                  # finest stored data (use 1m if you want a 1m LTF)

active_instruments: [EUR_USD, SPX500_USD]

instruments:
  EUR_USD:
    symbol: EUR_USD
    asset_class: fx
    pip_size: 0.0001
    tick_size: 0.00001
    price_precision: 5
    unit_precision: 0
    min_units: 1
    max_units: 100000000
    margin_rate: 0.0333          # VERIFY (30:1)
    spread: {kind: fixed, typical: 0.00010}
    max_spread: 0.00030
    slippage_entry: 0.00001
    slippage_stop: 0.00005
    commission_per_unit_rt: 0.0  # OANDA standard account: spread-only pricing
    day_anchor_ny: "17:00"
    entry_sessions:
      - {name: london, start: "02:00", end: "05:00"}
      - {name: new_york, start: "07:00", end: "10:00"}
    pool_sessions:
      - {name: asia, start: "19:00", end: "02:00"}
      - {name: london, start: "02:00", end: "08:00"}
      - {name: new_york, start: "08:00", end: "17:00"}
    news_currencies: [EUR, USD]
    futures: {is_futures: false, roll_method: none}

  SPX500_USD:
    symbol: SPX500_USD
    asset_class: index_cfd
    pip_size: 1.0                # 1 index point
    tick_size: 0.1
    price_precision: 1
    unit_precision: 0
    min_units: 1
    max_units: 1000000
    margin_rate: 0.05            # VERIFY (20:1)
    spread: {kind: fixed, typical: 0.6}
    max_spread: 1.5
    slippage_entry: 0.2
    slippage_stop: 0.6
    commission_per_unit_rt: 0.0
    day_anchor_ny: "17:00"
    entry_sessions:
      - {name: ny_open, start: "09:30", end: "11:30"}
    pool_sessions:
      - {name: overnight, start: "18:00", end: "09:30"}
      - {name: cash, start: "09:30", end: "16:00"}
    news_currencies: [USD]
    futures: {is_futures: false, roll_method: none}   # CFD: continuous, no rolls

signals:
  atr_period: 14
  htf_swing_n: 3
  mtf_swing_n: 3
  eq_tol_atr: 0.1
  eq_max_sep_bars: 300
  eq_lookback_swings: 8
  min_sweep_atr: 0.05
  reclaim_bars: 3
  disp_mult: 1.0
  mss_max_bars: 6
  fvg_min_atr: 0.1
  fvg_select: largest           # largest | first | latest
  entry_mode: edge              # edge | midpoint
  max_wait_bars: 24             # LTF bars
  fill_through_ticks: 1
  opposite_signal_rule: ignore  # ignore | tighten_stop | exit  (applied in Phase 2)

pools:
  use_pdh_pdl: true
  use_pwh_pwl: true
  use_sessions: true
  use_equal_mtf: true
  use_equal_htf: true
  daily_max_age_days: 5
  weekly_max_age_weeks: 4
  session_max_age_days: 2
  eq_max_age_bars: 500
  tp_scope: any                 # any | external

bias:
  enabled: true
  htf_trend_filter: false       # optional; test on/off
  reference: entry              # entry | signal_close

filters:
  session_enabled: true
  spread_enabled: true
  news:
    enabled: false
    csv_path: null              # timestamp_utc,currency,impact,event
    before_min: 15
    after_min: 15
    min_impact: high
  volatility:
    enabled: true
    lookback_bars: 2000
    min_percentile: 0.20
  chop:
    enabled: false
    er_period: 20
    min_er: 0.20
  max_trades_per_day: 2         # enforced by the Phase 2 risk manager

stops:
  stop_mode: sweep_extreme      # sweep_extreme | fvg_first_candle
  stop_buffer_atr: 0.1          # test range 0 .. 0.25
  min_stop_atr: 0.5
  max_stop_atr: 1.5
  min_stop_action: widen        # widen | skip

targets:
  tp_mode: opposing_liquidity   # opposing_liquidity | fixed_rr | partial_runner | trailing
  fixed_rr: 2.0                 # test 2 and 3
  min_rr: 2.0
  partial_pct: 0.5
  partial_at: 1R                # 1R | internal_liquidity
  be_offset_r: 0.1
  trail_activation_r: 1.0
  trail_mode: swing             # swing | fvg
  time_stop_bars: null          # LTF bars; null = off
  time_stop_r: 0.5

data:
  csv:
    tz: UTC                     # timezone of timestamps inside the CSV (MT5 exports are SERVER time, not UTC)
    timestamp_col: null
    time_format: null
  quality:
    fail_on_error: true
    spike_mult: 15.0
    spike_window: 200
    wide_spread_mult: 8.0
    long_gap_hours: 3.0
    daily_break_max_minutes: 90

viz:
  mtf_bars_before: 48
  mtf_bars_after: 32
  dpi: 110
  include_skipped: true
  max_charts: 60


# Phase 2 event-driven simulation and independent account risk controls.
backtest:
  initial_capital: 10000.0
  intrabar_stop_first: true
  force_close_at_end: true
  max_pending_orders: 100
  default_spread_stress: 1.0
  slippage_stress: 1.0
  use_bid_ask_if_available: true
  allow_ai_without_model: false
  session_end_exit: false
  weekend_exit: true

risk:
  risk_per_trade_pct: 0.005       # 0.5% of current balance
  daily_loss_limit_pct: 0.02      # realized + unrealized equity drawdown from NY trading-day start
  weekly_loss_limit_pct: 0.04
  max_drawdown_pct: 0.10          # equity high-water mark; kill switch
  max_portfolio_risk_pct: 0.01
  max_open_positions_per_instrument: 1
  max_trades_per_day: 2
  max_consecutive_losses: 3
  cooldown_bars_after_loss: 12
  enforce_margin: true
